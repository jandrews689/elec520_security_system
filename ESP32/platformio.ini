; ELEC520-secsys/platformio.ini
[platformio]
default_envs = esp32_floor
src_dir = esp32_floor/src
include_dir = esp32_floor/include

[env:esp32_floor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient
    bblanchon/ArduinoJson
    marcoschwartz/LiquidCrystal_I2C
build_flags =
    -DCORE_DEBUG_LEVEL=0                                                             